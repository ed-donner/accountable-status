[project]
name = "accountable-status"
version = "0.1.0"
description = "A status page for Accountable"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "backend"
module-name = "status"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore:Using `httpx` with"]
